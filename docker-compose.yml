version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: avaliamais-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avalia_mais
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: avaliamais-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/avalia_mais?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: avaliamaissecretkey2024avaliamaissecretkey2024avaliamaissecretkey
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: avaliamais-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"

volumes:
  mysql_data:
